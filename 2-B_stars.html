<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>星を並べる</title>
  </head>
  <body>
    <h2>★を並べる</h2>
    <input type="number" id="starCount" />
    <button onclick="printStars()">表示</button>
    <p id="stars"></p>

    <script>
      function printStars() {
        const count = Number(document.getElementById("starCount").value);

        let result = "";
        for (let i = 1; i <= count; i++) {
          result += "★";
        }

        if(count<0){
            result = "0以上の数値を入力してください";
        }

        if(count>20){
            count = 20;
        }

        document.getElementById("stars").innerText = result;
      }
    </script>
  </body>
</html>
